# FALLBACK deployment (primary is Cloudflare Workers — see README).
# GitHub Actions cron has a 5-minute floor, is routinely 5-30+ minutes late,
# and silently disables after 60 days without repo activity. Fine as a backup,
# not ideal for catching a ticket drop within minutes.
name: Odyssey 70mm check

on:
  schedule:
    - cron: "*/10 * * * *" # nominal; real cadence is usually 10-30 min
  workflow_dispatch:
    inputs:
      alert_after:
        description: "Drill: temporarily override ALERT_AFTER_DATE (e.g. 2026-09-15)"
        required: false
        default: ""

concurrency:
  group: odyssey-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Dispatch-only drill override; scheduled runs always use the code default.
          ALERT_AFTER_DATE: ${{ inputs.alert_after || '2026-09-16' }}
      - name: Persist state (alerts, and the failure counter across runs)
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "odyssey-watcher"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "chore: update watcher state [skip ci]"
            # Another scheduled run may have pushed first; rebase and retry once.
            git pull --rebase --quiet || true
            git push || (git pull --rebase --quiet && git push)
          fi
